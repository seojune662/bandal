name: Register fixed Apple iPad identifier
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apple-ipad-registration
  cancel-in-progress: false
jobs:
  register:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Verify fixed registration and output boundaries without secrets
        run: node --test scripts/test-apple-ipad-register.mjs
      - name: Register app.bandal.ipad and enable Sign in with Apple if missing
        # No token/key files, inputs, artifacts, third-party dependencies or shell expansion.
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/apple-ipad-register.mjs
