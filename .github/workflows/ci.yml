# Check affected code once per commit. Release reuses this exact-SHA result.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: 'Run the full unit suite and dead-code audit'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    name: Affected checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify changed code and its dependents
        env:
          FULL: ${{ inputs.full == true && '--full' || '' }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          args=()
          if [ -n "$FULL" ]; then args+=("$FULL"); fi
          if [ -n "$PR_BASE" ]; then args+=(--base "$PR_BASE"); fi
          node scripts/affected-checks.mjs "${args[@]}"
