# Check affected code once per commit. Release reuses this exact-SHA result.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: 'Run the full unit suite and dead-code audit'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    name: Affected checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Select backend verification
        id: backend
        env:
          FULL: ${{ inputs.full == true && '--full' || '' }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          args=()
          if [ -n "$FULL" ]; then args+=("$FULL"); fi
          if [ -n "$PR_BASE" ]; then args+=(--base "$PR_BASE"); fi
          echo "required=$(node scripts/affected-checks.mjs --backend-plan "${args[@]}")" >> "$GITHUB_OUTPUT"
      - uses: denoland/setup-deno@v2
        if: steps.backend.outputs.required == 'true'
        with:
          deno-version: v2.9.4
      - uses: supabase/setup-cli@v1
        if: steps.backend.outputs.required == 'true'
        with:
          version: 2.110.0
      - name: Verify changed code and its dependents
        env:
          FULL: ${{ inputs.full == true && '--full' || '' }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          args=()
          if [ -n "$FULL" ]; then args+=("$FULL"); fi
          if [ -n "$PR_BASE" ]; then args+=(--base "$PR_BASE"); fi
          node scripts/affected-checks.mjs "${args[@]}"
