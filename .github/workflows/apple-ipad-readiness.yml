name: Apple iPad readiness (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    # Inspect reviewed main only, without configurable refs, identifiers or URLs.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Verify read-only request and output boundaries without secrets
        run: node --test scripts/test-apple-ipad-readiness.mjs
      - name: Inspect existing iPad registration and subscription metadata
        # These secrets are available only to this process, never checkout/tests.
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node scripts/apple-ipad-readiness.mjs
