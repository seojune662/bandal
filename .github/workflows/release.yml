# Builds and publishes a Bandal release for macOS and Windows.
#
# Trigger: push a tag like `v0.2.0`. The tag must match package.json `version`
# exactly (minus the leading `v`) — electron-updater compares the running
# app's version against the one in latest*.yml, and a mismatch means students
# either never see the update or get offered one they already have. The
# `verify` job below fails fast rather than let that ship.
#
# Shape:
#
#   verify ──► create-release (draft) ──┬─► build (macos)   ─┐
#                                       └─► build (windows) ─┴─► publish
#
# The draft exists before the build jobs start because both would otherwise
# race to create the same release and one would get a 422. It stays a draft
# until BOTH platforms succeed: a half-published release means Windows students
# see latest.yml missing while macOS students update fine, which is worse than
# no release at all.
name: Release

on:
  push:
    tags:
      - 'v*'
  # Lets you rehearse the whole pipeline against an existing tag without
  # cutting a new one.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Verify version and tests
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - id: resolve
        name: Resolve tag and check it matches package.json
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG implies version $VERSION but package.json says $PKG_VERSION."
            echo "::error::Bump package.json and re-tag — electron-updater compares these."
            exit 1
          fi
          echo "Releasing $TAG (version $VERSION)"

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # A full install on purpose: the test suite opens real SQLite databases
      # through the `better-sqlite3-node` alias, whose native binding is
      # fetched by its own install script. `--ignore-scripts` would skip that
      # and every repo/migration test would fail to load a binding.
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  create-release:
    name: Create draft release
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - name: Create the draft if it does not exist
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.verify.outputs.tag }}"
          # `gh release view <tag>` cannot resolve a DRAFT release — drafts are
          # not addressable by tag until published, and it exits "release not
          # found". Probing with it made a re-run try to create a second draft
          # and take a 422. Go through the API, which does list drafts.
          EXISTING="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name==\"$TAG\") | .id" | head -n1)"
          if [ -n "$EXISTING" ]; then
            echo "Release $TAG already exists (id $EXISTING) — reusing it."
          else
            # Created through the API, not `gh release create`, so the id comes
            # straight back in the response. Re-querying the list right after
            # creating returned nothing — the new draft is not visible there
            # immediately, and the empty id then failed every upload job.
            EXISTING="$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" \
              -f name="$TAG" \
              -F draft=true \
              -F generate_release_notes=true \
              --jq '.id')"
            echo "Created draft release $TAG (id $EXISTING)."
          fi
          if [ -z "$EXISTING" ]; then
            echo "::error::Could not resolve a release id for $TAG."
            exit 1
          fi
          # Every build job uploads into THIS id. Letting electron-builder
          # publish on its own meant the two platform jobs each resolved the
          # release independently and raced: v0.4.0 ended up as two drafts,
          # one holding only the mac assets and the other only Windows.
          echo "release_id=$EXISTING" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: [verify, create-release]
    runs-on: ${{ matrix.os }}
    # Notarization waits on Apple's service; 25 minutes is normal, so do not
    # lower this without checking a real run.
    timeout-minutes: 60
    strategy:
      # Do not cancel the other platform when one fails — knowing whether the
      # failure is platform-specific is most of the debugging.
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            # MAC_IDENTITY is resolved to a SHA-1 hash by the step below, and
            # expanded by the shell (not `${{ }}`) so it picks up the value the
            # earlier step wrote to GITHUB_ENV.
            build: pnpm exec electron-builder --mac --publish never -c.mac.identity="$MAC_IDENTITY"
          - name: Windows
            os: windows-latest
            build: pnpm exec electron-builder --win --publish never
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Compiles main/preload/renderer into out/. electron-builder only
      # *packages* — it does not compile — so without this it asars an empty
      # tree and fails the entry-file sanity check. The `pnpm dist` script pairs
      # the two for exactly this reason; the matrix command below cannot use
      # that script because it needs the --publish flag.
      - name: Build (electron-vite compiles main/preload/renderer)
        run: pnpm build
        env:
          # MUST be here, not on the electron-builder step below. electron-vite
          # inlines import.meta.env at COMPILE time; electron-builder only
          # packages. They were attached to the packaging step from f990637
          # until v0.2.0, so every shipped build had an empty Supabase config,
          # readSupabaseConfig() returned null, auth phase stayed
          # 'unconfigured' and 함께하기 DISAPPEARED from the app entirely —
          # silently, with a green build.
          MAIN_VITE_SUPABASE_URL: ${{ secrets.MAIN_VITE_SUPABASE_URL }}
          MAIN_VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.MAIN_VITE_SUPABASE_PUBLISHABLE_KEY }}

      # The failure above was invisible: nothing errored, a feature just went
      # missing. Assert the inlining actually happened so it can never ship
      # quietly again. Never prints the values.
      - name: Assert the Supabase config was inlined
        env:
          MAIN_VITE_SUPABASE_URL: ${{ secrets.MAIN_VITE_SUPABASE_URL }}
        run: |
          # Exact match against the secret, not a /supabase\.co/ substring.
          # @supabase/supabase-js ships ~200 placeholder URLs of its own
          # (xyzcompany.supabase.co, example.supabase.co, ...), so a substring
          # test can pass on a build whose real config is empty. Actions masks
          # the value in logs, and nothing is printed either way.
          node -e "
            const url = (process.env.MAIN_VITE_SUPABASE_URL || '').trim();
            if (url === '') {
              console.error('::error::secret MAIN_VITE_SUPABASE_URL is empty - 함께하기 would be absent from this build.');
              process.exit(1);
            }
            const s = require('fs').readFileSync('out/main/index.js','utf8');
            if (!s.includes(url)) {
              console.error('::error::the configured Supabase URL is not in out/main/index.js - check the env block on the pnpm build step.');
              process.exit(1);
            }
            console.log('Supabase config inlined (exact match).');
          "

      # --- macOS signing -------------------------------------------------
      # Imports the Developer ID cert into a throwaway keychain. Without this
      # the build is unsigned, and an unsigned macOS app can neither pass
      # Gatekeeper nor auto-update (Squirrel.Mac verifies the signature).
      - name: Import Developer ID certificate
        if: matrix.os == 'macos-14'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MAC_CERT_P12 }}
          p12-password: ${{ secrets.MAC_CERT_PASSWORD }}

      # Leave exactly one Developer ID Application identity in the keychain.
      #
      # The .p12 carries two *valid* certificates with the identical name
      # "Developer ID Application: … (TEAMID)". codesign then aborts with
      # `ambiguous (matches … and …)` and signs nothing.
      #
      # Pinning `mac.identity` to a SHA-1 hash does NOT help: electron-builder
      # resolves the hash correctly but still invokes `codesign --sign <name>`,
      # so the name stays ambiguous. The duplicate itself has to go.
      #
      # This only touches the throwaway keychain the previous step created —
      # nothing on a developer machine changes. Either certificate signs and
      # notarizes fine (same team, both valid), so keeping the first is
      # arbitrary but deterministic.
      - name: Deduplicate signing identity
        if: matrix.os == 'macos-14'
        run: |
          list_hashes() {
            security find-identity -v -p codesigning signing_temp.keychain \
              | grep 'Developer ID Application' | awk '{print $2}'
          }
          HASHES="$(list_hashes)"
          if [ -z "$HASHES" ]; then
            echo "::error::No Developer ID Application identity in the signing keychain."
            echo "::error::Check the MAC_CERT_P12 / MAC_CERT_PASSWORD secrets."
            exit 1
          fi
          COUNT="$(echo "$HASHES" | wc -l | tr -d ' ')"
          echo "Found $COUNT Developer ID Application identity/identities."
          if [ "$COUNT" -gt 1 ]; then
            for h in $(echo "$HASHES" | tail -n +2); do
              echo "Removing duplicate $h from the temporary keychain"
              security delete-certificate -Z "$h" signing_temp.keychain
            done
          fi
          KEEP="$(list_hashes)"
          if [ "$(echo "$KEEP" | wc -l | tr -d ' ')" -ne 1 ]; then
            echo "::error::Expected exactly one signing identity, got:"
            echo "$KEEP"
            exit 1
          fi
          echo "Signing with $KEEP"
          echo "MAC_IDENTITY=$KEEP" >> "$GITHUB_ENV"

      # electron-builder looks for the App Store Connect key at this exact
      # path when APPLE_API_KEY names it. An API key is used rather than an
      # Apple ID + app-specific password because it never triggers 2FA and
      # does not expire — the one idea worth borrowing from the
      # ios-app-store-submit playbook.
      - name: Stage App Store Connect API key
        if: matrix.os == 'macos-14'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          KEY_PATH="$HOME/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          # Exported here rather than in the build step's `env:` block —
          # GitHub does not expand `~` or `$HOME` there, and electron-builder
          # would look for a literal "~/private_keys/..." and fail to notarize.
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build the installers
        run: ${{ matrix.build }}
        env:
          # Publishing target: this repo. The built-in token is enough because
          # source and releases live together.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # NOTE: the Supabase vars are deliberately NOT here. electron-builder
          # does not compile, so setting them at this step does nothing — that
          # was the v0.1.0–v0.2.0 bug. They live on the `pnpm build` step above.

          # Notarization (macOS only; ignored elsewhere). APPLE_API_KEY itself
          # is exported to GITHUB_ENV by the staging step above, because a
          # `~`/`$HOME` path does not expand in this block.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Kept for post-mortems: the publish step uploads to the release, but a
      # failed run leaves nothing to inspect otherwise.
      # Uploading here, rather than letting electron-builder publish, is what
      # makes the two platform jobs deterministic: both push into the single
      # release id minted by create-release. `gh release upload` is not usable
      # because it resolves by TAG, and a draft is not addressable by tag.
      - name: Upload the installers into the draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::create-release did not hand down a release id."
            exit 1
          fi
          shopt -s nullglob
          uploaded=0
          for file in release/*.dmg release/*.zip release/*.exe \
                      release/*.blockmap release/latest*.yml; do
            name="$(basename "$file")"
            echo "uploading $name"
            # Replace an existing asset so a re-run is idempotent rather than
            # failing on a duplicate name.
            existing="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
              --paginate --jq ".[] | select(.name==\"$name\") | .id" | head -n1)"
            if [ -n "$existing" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$existing" >/dev/null
            fi
            gh api -X POST \
              --hostname uploads.github.com \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name" \
              -H 'Content-Type: application/octet-stream' \
              --input "$file" >/dev/null
            uploaded=$((uploaded + 1))
          done
          if [ "$uploaded" -eq 0 ]; then
            echo "::error::electron-builder produced no artifacts to upload."
            exit 1
          fi
          echo "uploaded $uploaded asset(s) into release $RELEASE_ID"

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ matrix.os }}
          path: |
            release/*.yml
            release/builder-*.yaml
          if-no-files-found: ignore

  publish:
    name: Publish release
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - name: Check both platforms uploaded their update feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.verify.outputs.tag }}"
          # Same draft-invisibility trap as create-release: this release is
          # still a draft at this point, so `gh release view` returns
          # "release not found" and the check below failed even though both
          # platforms had uploaded correctly. That is exactly how v0.1.1 built
          # green on both runners and still never shipped.
          RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name==\"$TAG\") | .id" | head -n1)"
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::No release found for $TAG (draft or published)."
            exit 1
          fi
          echo "release_id=$RELEASE_ID" >> "$GITHUB_ENV"
          ASSETS="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --paginate --jq '.[].name')"
          echo "$ASSETS"
          MISSING=0
          # These two files ARE the auto-update feed. A release without them
          # installs fine but never updates anyone — the failure mode this
          # whole pipeline exists to prevent.
          for required in latest-mac.yml latest.yml; do
            echo "$ASSETS" | grep -qx "$required" || { echo "::error::missing $required"; MISSING=1; }
          done
          exit $MISSING

      - name: Undraft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # By id, not by tag — `gh release edit <tag>` cannot see the draft
          # it is being asked to publish.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false --jq '.html_url'

      # The marketing site reads the newest release tag at BUILD time, so a
      # release it never rebuilt for leaves it advertising an old version while
      # handing out the new binary (that gap reached v0.1.0-vs-v0.3.0). Vercel
      # only rebuilds on a push to the site repo, so nudge it here.
      #
      # Optional by design: without the secret this skips instead of failing.
      # A missing website refresh must never fail an otherwise good release.
      - name: Rebuild the website so its version label follows this release
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::VERCEL_DEPLOY_HOOK_URL is not set - skipping the website rebuild."
            echo "::notice::Add it (Vercel > bandal-web > Settings > Git > Deploy Hooks) to keep the site's version label automatic."
            exit 0
          fi
          code="$(curl -sS -X POST -o /dev/null -w '%{http_code}' "$HOOK")"
          if [ "$code" -ge 400 ]; then
            echo "::warning::Website rebuild hook returned HTTP $code. The release is fine; the site may show a stale version until its next deploy."
          else
            echo "Website rebuild triggered (HTTP $code)."
          fi
