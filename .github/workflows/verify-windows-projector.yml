name: Verify Windows projector paths offline
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact reviewed source commit on main; no account or credentials are used'
        required: true
permissions:
  contents: read
jobs:
  paths:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: previous-reproduction
            sha: f922a090ec506a9be8f06d8bd85084ddf45f8fc3
            expected: '--expect-broken'
          - version: corrected
            sha: '${{ inputs.source_sha }}'
            expected: ''
    env:
      SOURCE_SHA: ${{ matrix.sha }}
      EXPECTED: ${{ matrix.expected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: qa-runner
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: desktop
          ref: ${{ matrix.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact main source
        shell: bash
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C desktop rev-parse HEAD)" = "$SOURCE_SHA"
          git -C desktop merge-base --is-ancestor "$SOURCE_SHA" origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: desktop/package.json
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - run: pnpm exec electron-builder install-app-deps
        working-directory: desktop
      - name: Import synthetic portable records using the shipped projector
        run: node qa-runner/scripts/test-projector-roundtrip.cjs desktop better-sqlite3 $env:EXPECTED
      - name: Verify UTF-8 JSON pipes under a legacy Windows code page
        if: matrix.version == 'corrected'
        env:
          BANDAL_TEST_BRIDGE_SOURCE: '${{ github.workspace }}/desktop/resources/ipad-bridge/bridge.py'
        run: python qa-runner/tests/main/ipadSync/test_bridge_stdio.py
